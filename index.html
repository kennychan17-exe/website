<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kennyChan | Blog</title>
  <style>
    :root {
      --bg: #f0f9ff;
      --card: rgba(255, 255, 255, 0.72);
      --text: #0c4a6e;
      --muted: #0369a1;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --border: rgba(186, 230, 253, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;

      background-image: url('https://raw.githubusercontent.com/kennychan17-exe/website/refs/heads/main/7c32f880295bc389d9c688ebe6b25371.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Soft light-blue overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        165deg,
        rgba(240, 249, 255, 0.88) 0%,
        rgba(224, 242, 254, 0.78) 45%,
        rgba(240, 249, 255, 0.85) 100%
      );
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      padding: 5.5rem 0 3.5rem;
      text-align: center;
      animation: fadeUp 0.7s ease-out;
    }

    header h1 {
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.6rem;
      background: linear-gradient(90deg, #0369a1, #0ea5e9, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p.tagline {
      font-size: 1.15rem;
      color: var(--muted);
      margin-bottom: 2.2rem;
      font-weight: 400;
      animation: fadeUp 0.7s ease-out 0.1s both;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: 0.75rem 1.9rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      transition: all 0.25s ease;
      animation: fadeUp 0.7s ease-out 0.2s both;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25);
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
    }

    section {
      margin-bottom: 4.2rem;
      animation: fadeUp 0.7s ease-out both;
    }

    #about { animation-delay: 0.15s; }
    #socials { animation-delay: 0.25s; }

    h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.3rem;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    p {
      color: var(--muted);
      margin-bottom: 0.95rem;
      font-size: 1.02rem;
    }

    .socials {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.4rem;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 1.8rem 1.5rem;
      border: 1px solid var(--border);
      text-align: center;
      transition: all 0.3s ease;
      animation: fadeUp 0.6s ease-out both;
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.06);
    }

    .card:nth-child(1) { animation-delay: 0.3s; }
    .card:nth-child(2) { animation-delay: 0.4s; }
    .card:nth-child(3) { animation-delay: 0.5s; }

    .card:hover {
      transform: translateY(-7px);
      box-shadow: 0 12px 30px rgba(14, 165, 233, 0.12);
      border-color: rgba(14, 165, 233, 0.35);
      background: rgba(255, 255, 255, 0.85);
    }

    .card .icon {
      font-size: 1.85rem;
      margin-bottom: 0.6rem;
    }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--text);
    }

    .card p {
      font-size: 0.9rem;
      margin-bottom: 1.1rem;
      color: var(--muted);
    }

    .card a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .card a:hover {
      color: var(--accent-hover);
    }

    footer {
      text-align: center;
      padding: 2.8rem 0 3rem;
      color: var(--muted);
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
      border-top: 1px solid rgba(186, 230, 253, 0.5);
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 2.15rem;
      }
      header {
        padding: 4rem 0 2.8rem;
      }
      .card {
        padding: 1.5rem 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Your Name</h1>
      <p class="tagline">just learning to code</p>
      <a href="#socials" class="btn">find me here</a>
    </header>

    <section id="about">
      <h2>about</h2>
      <p>
        hello I'm kennyChan I'm trying to make something new.
      </p>
      <p>
        I'm just trying to learn something new tho.
      </p>
    </section>

    <section id="socials">
      <h2>socials</h2>
      <div class="socials">
        <div class="card">
          <div class="icon">🐙</div>
          <h3>GitHub</h3>
          <p>my code stuff</p>
          <a href="https://github.com/kennychan17-exe" target="_blank">check it out →</a>
        </div>

        <div class="card">
          <div class="icon">💬</div>
          <h3>Discord</h3>
          <p>hit me up</p>
          <a href="https://discord.com/users/ballknowledge17" target="_blank">message me →</a>
        </div>

        <div class="card">
          <div class="icon">🎮</div>
          <h3>Steam</h3>
          <p>my steam</p>
          <a href="https://steamcommunity.com/id/notraghav17" target="_blank">view profile →</a>
        </div>
      </div>
    </section>
  </div>

  <footer>
    <p>© 2026 KennyChan</p>
  </footer>
</body>
</html>
